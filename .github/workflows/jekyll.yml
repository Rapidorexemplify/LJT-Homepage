name: Build and inspect Academic Pages site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - run: npm install -g uglify-js
      - run: uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - id: configure
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
      - name: Show Pages metadata
        uses: actions/github-script@v7
        with:
          script: |
            core.info('configure outputs: ' + JSON.stringify(${{ toJSON(steps.configure.outputs) }}));
            try {
              const { data } = await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              core.info('PAGES_METADATA ' + JSON.stringify({
                html_url: data.html_url,
                status: data.status,
                build_type: data.build_type,
                source: data.source,
                public: data.public,
                https_enforced: data.https_enforced
              }));
            } catch (error) {
              core.info('PAGES_ERROR ' + error.message);
            }
