name: Inspect Pages build

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read Pages builds
        uses: actions/github-script@v7
        with:
          script: |
            const pages = await github.rest.repos.getPages({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            core.info('PAGES ' + JSON.stringify({
              url: pages.data.html_url,
              status: pages.data.status,
              build_type: pages.data.build_type,
              source: pages.data.source
            }));
            const builds = await github.rest.repos.listPagesBuilds({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 10
            });
            for (const b of builds.data) {
              core.info('BUILD ' + JSON.stringify({
                status: b.status,
                error: b.error,
                commit: b.commit,
                duration: b.duration,
                created_at: b.created_at
              }));
            }
